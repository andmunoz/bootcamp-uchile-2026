name: test-workflow
on: [push]
jobs:
  java-version:
    runs-on: ubuntu-latest
    steps:
      - name: Java Setup
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Java Version Verify
        run: java --version
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Latest Commit
        uses: actions/checkout@v7
      - name: Java Setup
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit Test Execution
        run: ./gradlew test

